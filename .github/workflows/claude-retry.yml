# 한도 초과·서버 오류 등으로 멈춘 @claude 작업(「자동재시도」 라벨이 붙은 열린 이슈)을 매시간 이어서 돌린다.
# 라벨은 claude.yml 의 「멈춘 이유 알리기」 단계가 붙인다. 한도가 아직 안 풀렸으면 다시 멈추고 라벨이 다시 붙어 다음 시간에 또 시도한다.
name: 멈춘 작업 자동 이어 하기

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

concurrency:
  group: claude-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      issues: write
    steps:
      - name: 멈춘 이슈 이어서 돌리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          # 이미 돌거나 기다리는 @claude 실행이 있으면 그만큼 덜 띄운다(한 번에 5개까지)
          busy=$(gh run list -R "$R" -w claude.yml -L 50 --json status -q '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length')
          room=$((5 - busy)); [ "$room" -lt 0 ] && room=0
          issues=$(gh issue list -R "$R" -l 자동재시도 -s open -L 50 --json number -q '.[].number' | sort -n)
          echo "기다리는 이슈: ${issues:-없음} · 돌고 있는 실행: $busy · 이번에 띄울 수: $room"
          for n in $issues; do
            [ "$room" -le 0 ] && break
            tries=$(gh api "repos/$R/issues/$n/comments" --paginate -q '[.[] | select(.body | contains("<!-- auto-retry -->"))] | length' | awk '{s+=$1} END{print s+0}')
            gh issue edit "$n" -R "$R" --remove-label 자동재시도 >/dev/null
            gh issue comment "$n" -R "$R" --body "🔁 자동으로 이어서 다시 시도해요 ($((tries + 1))번째).<!-- auto-retry -->" >/dev/null
            gh workflow run claude.yml -R "$R" --ref main -f issue="$n"
            echo "#$n 이어 하기 시작"
            room=$((room - 1))
          done
