# 문제지(문제만) + 해설지(정답·해설) PDF를 GitHub에서 다시 만든다.
#
# 언제 돌아가나
#   - main 에 분류/해설/원본/작업기록/과목정보/폰트/만드는 프로그램이 바뀌어 올라오면 자동으로
#   - 저장소 → Actions → "문제지·해설지 PDF 만들기" → Run workflow 를 누르면 언제든지
# 하는 일
#   (저장소는 사용자 결정으로 공개 — 2026-11-13부터 공개 여부로 멈추지 않음)
#   1) 과목마다 문제지/ 와 해설지/ 의 PDF를 새로 만들고 검증 (하나라도 실패하면 아무것도 저장하지 않음)
#   2) 바뀐 PDF만 커밋해서 같은 브랜치에 올림 (내용이 같으면 파일도 똑같이 나와서 커밋 없음)
# 해설 문장을 고치고 싶으면 해설/<과목>/<시험id>.json 의 "explanation" 을 GitHub 웹에서 고치면 된다.
name: 문제지·해설지 PDF 만들기

on:
  workflow_dispatch:
    inputs:
      subject:
        description: '과목 이름 (비우면 분류된 과목 전부)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '분류/**'
      - '해설/**'
      - '원본/**'
      - '작업기록/**'
      - '과목정보/**'
      - 'fonts/**'
      - 'tools/build_lectures.py'
      - 'tools/build_answers.py'
      - 'tools/answer_key.py'
      - '.claude/skills/gichul-strip/scripts/**'
      - '.github/workflows/build-pdfs.yml'

permissions:
  contents: write

concurrency:
  group: build-pdfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 로컬(클라우드 세션)과 같은 버전을 써야 같은 내용이면 PDF도 똑같이 나온다
      - name: 프로그램·폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wkhtmltopdf fontconfig fonts-dejavu-core fonts-liberation fonts-wqy-zenhei
          wkhtmltopdf --version
          pip install -q pymupdf==1.28.2 pypdf==6.19.0 reportlab==5.0.1 fonttools==4.66.1 \
                         numpy==2.4.6 pillow==12.3.0 cffi==2.1.1
          python3 .claude/skills/gichul-strip/scripts/setup_fonts.py fonts

      - name: PDF 만들기
        env:
          SUBJECT: ${{ github.event.inputs.subject }}
        run: |
          if [ -n "$SUBJECT" ]; then
            subjects=("$SUBJECT")
          else
            subjects=()
            for d in 분류/*/; do
              ls "$d"*.json >/dev/null 2>&1 && subjects+=("$(basename "$d")")
            done
          fi
          for s in "${subjects[@]}"; do
            echo "::group::$s — 문제지"
            python3 tools/build_lectures.py "$s"
            echo "::endgroup::"
            echo "::group::$s — 정답·해설"
            python3 tools/answer_key.py "$s"
            python3 tools/build_answers.py "$s"
            echo "::endgroup::"
          done

      - name: 바뀐 파일 저장 (커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 문제지 해설지 해설
          if git diff --cached --quiet; then
            echo "바뀐 PDF 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git diff --cached --stat | tail -5
          git commit -q -m "문제지·해설지 PDF 다시 만들기 (GitHub Actions)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
