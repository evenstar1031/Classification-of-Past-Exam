# 앱·아티팩트의 「기출·학습자료」 탭이 읽는 현황(app/gichul_index.json)과 「1학기 자료」 목록(1학기/목록.json)을 main 에 올라올 때마다 다시 만든다.
name: 앱 현황 갱신

on:
  # Claude 가 정리를 끝내면 이어서 (Claude 의 푸시는 다른 워크플로를 깨우지 않으므로)
  workflow_run:
    workflows: ["기출 자동 정리", "Claude (@claude)"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '분류/**'
      - '문제지/**'
      - '해설지/**'
      - '학습자료/**'
      - '과목정보/**'
      - '자료실/**'
      - 'tools/make_app_index.py'
      - 'tools/sem1_import.py'
      - '.github/workflows/app-index.yml'

permissions:
  contents: write

concurrency:
  group: app-index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 현황 만들기
        run: |
          pip install -q pymupdf==1.28.2 pypdf==6.19.0 reportlab==5.0.1 fonttools==4.66.1 numpy==2.4.6 pillow==12.3.0
          python3 tools/make_app_index.py
          # 1학기 자료 목록: 기출이 올리기 → 원본으로 옮겨졌거나 지워졌으면 맞춘다
          if [ -f 1학기/목록.json ]; then python3 tools/sem1_import.py sync; fi
      - name: 바뀌었으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gichul_index.json
          if [ -f 1학기/목록.json ]; then git add 1학기/목록.json; fi
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -q -m "앱 현황 갱신"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
